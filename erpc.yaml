logLevel: warn

database:
  evmJsonRpcCache:
    connectors:
      - id: memory-cache
        driver: memory
        memory:
          maxItems: 10000000
          maxTotalSize: "6GB"
          emitMetrics: true
    policies:
      - network: "*"
        method: "*"
        finality: finalized
        connector: memory-cache

server:
  httpHostV4: "0.0.0.0"
  httpHostV6: "[::]"
  httpPort: 4000

metrics:
  enabled: true
  hostV4: "0.0.0.0"
  hostV6: "[::]"
  port: 4001

projects:
  - id: main
    cors:
      allowedOrigins:
        - 'https://moonwell.fi'
        - 'https://*.moonwell-frontend-v2-react.pages.dev'
        - 'http://localhost:3000'
        - 'https://*.moonwell.workers.dev'
        - 'https://mamo.bot'
      allowedHeaders:
        - 'Content-Type'
        - 'Authorization'
      allowedMethods:
        - 'GET'
        - 'POST'
        - 'OPTIONS'

    networkDefaults:
      directiveDefaults:
        retryPending: false
        retryEmpty: true
      failsafe:
        timeout:
          duration: 300s
        hedge:
          quantile: 0.95
          maxCount: 3
          minDelay: 100ms
          maxDelay: 5s
        retry:
          maxAttempts: 6
          delay: 0ms
          emptyResultConfidence: blockHead
          emptyResultIgnore: [ "eth_getLogs", "eth_call" ]
      evm:
        integrity:
          enforceHighestBlock: true
          enforceGetLogsBlockRange: true

    upstreamDefaults:
      autoIgnoreUnsupportedMethods: false
      evm:
        statePollerDebounce: 1s
        getLogsAutoSplittingRangeThreshold: 5000
        getLogsMaxAllowedRange: 20000
        getLogsSplitOnError: false
      failsafe:
        timeout:
          duration: 300s
        hedge: null
        retry:
          maxAttempts: 2
          delay: 0ms
          emptyResultConfidence: blockHead
          emptyResultIgnore: [ "eth_getLogs", "eth_call" ]
      rateLimitAutoTune:
        enabled: false
        adjustmentPeriod: 30s
        errorRateThreshold: 0.1
        increaseFactor: 1.1
        decreaseFactor: 0.7
        minBudget: 1
        maxBudget: 100000
      routing:
        scoreMultipliers:
          - respLatency: 20
            errorRate: 2
            blockHeadLag: 8

    upstreams:
      - id: erpc-chain-8453
        type: evm
        endpoint: https://base-mainnet.g.alchemy.com/v2/6nw4n7dsN20MECOIoosWv
        rateLimitBudget: global-erpc
        evm:
          chainId: 8453

      - id: erpc-chain-84532
        type: evm
        endpoint: https://base-sepolia.g.alchemy.com/v2/6nw4n7dsN20MECOIoosWv
        rateLimitBudget: global-erpc
        evm:
          chainId: 84532

      - id: erpc-chain-10
        type: evm
        endpoint: https://opt-mainnet.g.alchemy.com/v2/6nw4n7dsN20MECOIoosWv
        rateLimitBudget: global-erpc
        evm:
          chainId: 10

      - id: erpc-chain-11155420
        type: evm
        endpoint: https://moonbeam-mainnet.g.alchemy.com/v2/6nw4n7dsN20MECOIoosWv
        rateLimitBudget: global-erpc
        evm:
          chainId: 11155420

      - id: erpc-chain-1284
        type: evm
        endpoint: https://moonbeam-mainnet.g.alchemy.com/v2/6nw4n7dsN20MECOIoosWv
        rateLimitBudget: global-erpc
        evm:
          chainId: 1284

      - id: erpc-chain-1287
        type: evm
        endpoint: https://edge.goldsky.com/standard/evm/1287?token=${ERPC_SECRET}
        rateLimitBudget: global-erpc
        evm:
          chainId: 1287
      
      - id: erpc-chain-1285
        type: evm
        endpoint: https://edge.goldsky.com/standard/evm/1285?token=${ERPC_SECRET}
        rateLimitBudget: global-erpc
        evm:
          chainId: 1285

      - id: erpc-chain-1
        type: evm
        endpoint: https://eth-mainnet.g.alchemy.com/v2/6nw4n7dsN20MECOIoosWv
        rateLimitBudget: global-erpc
        evm:
          chainId: 1

      - id: erpc-chain-43114
        type: evm
        endpoint: https://avax-mainnet.g.alchemy.com/v2/6nw4n7dsN20MECOIoosWv
        rateLimitBudget: global-erpc
