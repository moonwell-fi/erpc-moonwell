logLevel: warn

database:
  evmJsonRpcCache:
    connectors:
      - id: memory-cache
        driver: memory
        memory:
          maxItems: 1000000000
    policies:
      - network: "*"
        method: "*"
        finality: finalized
        connector: memory-cache

server:
  httpHostV4: "0.0.0.0"
  httpHostV6: "[::]"
  httpPort: 4000

metrics:
  enabled: true
  hostV4: "0.0.0.0"
  hostV6: "[::]"
  port: 4001

projects:
  - id: main
    cors:
      allowedOrigins:
        - 'https://moonwell.fi'
        - 'https://*.moonwell-frontend-v2-react.pages.dev'
        - 'http://localhost:3000'
        - 'https://*.moonwell.workers.dev'
        - 'https://mamo.bot'
      allowedHeaders:
        - 'Content-Type'
        - 'Authorization'
      allowedMethods:
        - 'GET'
        - 'POST'
        - 'OPTIONS'

    networkDefaults:
      directiveDefaults:
        retryPending: false
        retryEmpty: true
      failsafe:
        timeout:
          duration: 300s
        hedge:
          quantile: 0.95
          maxCount: 3
          minDelay: 100ms
          maxDelay: 5s
        retry:
          maxAttempts: 6
          delay: 0ms
          emptyResultConfidence: blockHead
          emptyResultIgnore: [ "eth_getLogs", "eth_call" ]
      evm:
        integrity:
          enforceHighestBlock: true
          enforceGetLogsBlockRange: true

    upstreamDefaults:
      autoIgnoreUnsupportedMethods: false
      evm:
        statePollerDebounce: 1s
        getLogsAutoSplittingRangeThreshold: 5000
        getLogsMaxAllowedRange: 20000
        getLogsSplitOnError: false
      failsafe:
        timeout:
          duration: 300s
        hedge: null
        retry:
          maxAttempts: 2
          delay: 0ms
          emptyResultConfidence: blockHead
          emptyResultIgnore: [ "eth_getLogs", "eth_call" ]
      rateLimitAutoTune:
        enabled: true
        adjustmentPeriod: 30s
        errorRateThreshold: 0.1
        increaseFactor: 1.1
        decreaseFactor: 0.7
        minBudget: 1
        maxBudget: 100000
      routing:
        scoreMultipliers:
          - respLatency: 20
            errorRate: 2
            blockHeadLag: 8

    providers:
      - vendor: erpc
        settings:
          endpoint: https://c9856.pubgw0.us-west-2.aws.erpc.cloud/main/evm
          secret: {ERPC_SECRET}

    upstreams:
      - id: egc-arbitrum-one
        vendorName: erpc-edge-cache
        endpoint: grpc://egc-arbitrum-one.pubgcs.us-west-2.aws.erpc.cloud:443?secret=${ERPC_SECRET}
        evm:
          chainId: 42161
          statePollerDebounce: 500ms
          statePollerInterval: 2s
          maxAvailableRecentBlocks: 10000
        ignoreMethods:
          - "*"
        allowMethods:
          - eth_getLogs
          - eth_getBlockByHash
          - eth_getBlockReceipts
          - eth_getBlockByNumber
          - eth_getTransactionByHash
          - eth_getTransactionReceipt

      - id: egc-base
        vendorName: erpc-edge-cache
        endpoint: grpc://egc-base.pubgcs.us-west-2.aws.erpc.cloud:443?secret=${ERPC_SECRET}
        evm:
          chainId: 8453
          statePollerDebounce: 500ms
          statePollerInterval: 2s
          maxAvailableRecentBlocks: 2000
        ignoreMethods:
          - "*"
        allowMethods:
          - eth_getLogs
          - eth_getBlockByHash
          - eth_getBlockReceipts
          - eth_getBlockByNumber
          - eth_getTransactionByHash
          - eth_getTransactionReceipt

      - id: alchemy-chain-8453
        type: evm
        endpoint: https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}
        rateLimitBudget: global-alchemy
        evm:
          chainId: 8453

      - id: cdp-chain-8453
        type: evm
        endpoint: ${CDP_BASE_RPC_URL}
        rateLimitBudget: global-cdp
        evm:
          chainId: 8453

      - id: blastapi-chain-8453
        type: evm
        endpoint: https://base-mainnet.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 8453

      - id: blastapi-chain-84532
        type: evm
        endpoint: https://base-sepolia.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 84532

      - id: blastapi-chain-10
        type: evm
        endpoint: https://optimism-mainnet.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 10

      - id: blastapi-chain-11155420
        type: evm
        endpoint: https://optimism-sepolia.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
