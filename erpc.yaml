logLevel: warn

database:
  evmJsonRpcCache:
    connectors:
      - id: memory-cache
        driver: memory
        memory:
          maxItems: 1000000000
    policies:
      - network: "*"
        method: "*"
        finality: finalized
        connector: memory-cache

server:
  httpHostV4: "0.0.0.0"
  httpHostV6: "[::]"
  httpPort: 4000

metrics:
  enabled: true
  hostV4: "0.0.0.0"
  hostV6: "[::]"
  port: 4001

projects:
  - id: main
    cors:
      allowedOrigins:
        - 'https://moonwell.fi'
        - 'https://*.moonwell-frontend-v2-react.pages.dev'
        - 'http://localhost:3000'
      allowedHeaders:
        - 'Content-Type'
        - 'Authorization'
      allowedMethods:
        - 'GET'
        - 'POST'
        - 'OPTIONS'

    networkDefaults:
      directiveDefaults:
        retryPending: false
        retryEmpty: true
      failsafe:
        timeout:
          duration: 300s
        hedge:
          quantile: 0.95
          maxCount: 3
          minDelay: 100ms
          maxDelay: 5s
        retry:
          maxAttempts: 6 # Must be high-enough to retry on empty responses
          delay: 0ms
          emptyResultConfidence: blockHead
          emptyResultIgnore: [ "eth_getLogs", "eth_call" ]
      evm:
        integrity:
          enforceHighestBlock: true
          enforceGetLogsBlockRange: true

    upstreamDefaults:
      autoIgnoreUnsupportedMethods: false
      evm:
        statePollerDebounce: 1s
        getLogsAutoSplittingRangeThreshold: 5000
        getLogsMaxAllowedRange: 20000
        getLogsSplitOnError: false
      failsafe:
        timeout:
          duration: 300s
        hedge: null
        retry: null
      rateLimitAutoTune:
        enabled: true
        adjustmentPeriod: 30s
        errorRateThreshold: 0.1
        increaseFactor: 1.1
        decreaseFactor: 0.7
        minBudget: 1
        maxBudget: 100000
      routing:
        scoreMultipliers:
          - respLatency: 20
            errorRate: 2
            blockHeadLag: 8

    providers:
      - vendor: erpc
        settings:
          endpoint: c1863.us-west-2.aws.erpc.cloud/objective/evm
          secret: ${ERPC_SECRET}

    upstreams:
      - id: cdp-chain-8453
        type: evm
        endpoint: https://${CDP_BASE_RPC_URL}
        rateLimitBudget: global-cdp
        evm:
          chainId: 8453

      - id: blastapi-chain-8453
        type: evm
        endpoint: https://base-mainnet.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 8453

      - id: blastapi-chain-84532
        type: evm
        endpoint: https://base-sepolia.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 84532

      - id: blastapi-chain-10
        type: evm
        endpoint: https://optimism-mainnet.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 10

      - id: blastapi-chain-11155420
        type: evm
        endpoint: https://optimism-sepolia.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 11155420

      - id: blastapi-chain-1284
        type: evm
        endpoint: https://moonbeam.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 1284

      - id: blastapi-chain-1285
        type: evm
        endpoint: https://moonriver.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 1285

      - id: blastapi-chain-1287
        type: evm
        endpoint: https://moonbase-alpha.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 1287

      - id: blastapi-chain-1
        type: evm
        endpoint: https://eth-mainnet.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 1

      - id: blastapi-chain-43114
        type: evm
        endpoint: https://ava-mainnet.blastapi.io/${BLASTAPI_KEY}/ext/bc/C/rpc
        rateLimitBudget: global-blast
        evm:
          chainId: 43114

      - id: blastapi-chain-137
        type: evm
        endpoint: https://polygon-mainnet.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 137

      - id: blastapi-chain-42161
        type: evm
        endpoint: https://arbitrum-one.blastapi.io/${BLASTAPI_KEY}
        rateLimitBudget: global-blast
        evm:
          chainId: 42161

rateLimiters:
  budgets:
    - id: default-budget
      rules:
        - method: '*'
          maxCount: 10000
          period: 1s
    - id: global-cdp
      rules:
        - method: '*'
          maxCount: 5000
          period: 1s
    - id: global-blast
      rules:
        - method: '*'
          maxCount: 5000
          period: 1s
