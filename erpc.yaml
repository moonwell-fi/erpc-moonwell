          chainId: 137

      - id: erpc-chain-42161
        type: evm
        endpoint: https://arb-mainnet.g.alchemy.com/v2/6nw4n7dsN20MECOIoosWv
        rateLimitBudget: global-erpc
        evm:
          chainId: 42161

rateLimiters:
  budgets:
    - id: global-erpc
      rules:
        - method: '*'
          maxCount: 10000
          period: 1s