rateLimiters:
  budgets:
    - id: default-budget
      rules:
        - method: '*'
          maxCount: 10000
          period: 1s
    - id: global-cdp
      rules:
        - method: '*'
          maxCount: 5000
          period: 1s
    - id: global-blast
      rules:
        - method: '*'
          maxCount: 5000
          period: 1s
    - id: global-alchemy
      rules:
        - method: '*'
          maxCount: 5000
          period: 1s
